<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>TAARA*</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
     LOGIN SCREEN
========================== -->

<section id="loginScreen" class="screen">

    <div class="auth-card">

        <div class="logo">
            TAARA*
        </div>

        <p class="subtitle">
            Private conversations
        </p>

        <form id="loginForm">

            <input
                id="loginUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                id="loginPin"
                type="password"
                placeholder="PIN"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Enter Private Chat
            </button>

        </form>

        <p
            id="loginMessage"
            class="form-message"
        ></p>

        <button
            id="showCreateButton"
            class="secondary-button"
            type="button"
        >
            Create Account
        </button>

    </div>

</section>


<!-- =========================
     CREATE ACCOUNT SCREEN
========================== -->

<section
    id="createScreen"
    class="screen hidden"
>

    <div class="auth-card">

        <div class="logo">
            TAARA*
        </div>

        <p class="subtitle">
            Create your private account
        </p>

        <form id="createForm">

            <input
                id="createUsername"
                type="text"
                placeholder="Choose username"
                autocomplete="username"
                required
            >

            <input
                id="createPin"
                type="password"
                placeholder="Create PIN"
                autocomplete="new-password"
                required
            >

            <input
                id="confirmPin"
                type="password"
                placeholder="Confirm PIN"
                autocomplete="new-password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p
            id="createMessage"
            class="form-message"
        ></p>

        <button
            id="backToLoginButton"
            class="secondary-button"
            type="button"
        >
            Back to Login
        </button>

    </div>

</section>


<!-- =========================
     CHAT SCREEN
========================== -->

<section
    id="chatScreen"
    class="screen hidden"
>

    <div class="chat-container">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="chat-header">

            <div>

                <div class="chat-logo">
                    TAARA*
                </div>

                <div
                    id="loggedInUsername"
                    class="logged-in-user"
                ></div>

            </div>

            <button
                id="logoutButton"
                class="logout-button"
                type="button"
            >
                Logout
            </button>

        </header>


        <!-- =========================
             CONVERSATIONS
        ========================== -->

        <div class="section-title">
            Conversations
        </div>

        <div
            id="conversationList"
            class="conversation-list"
        ></div>


        <!-- =========================
             SEARCH USER
        ========================= -->

        <div class="section-title">
            Start a conversation
        </div>

        <form
            id="userSearchForm"
            class="search-form"
        >

            <input
                id="userSearchInput"
                type="text"
                placeholder="Find username"
                autocomplete="off"
            >

            <button type="submit">
                Search
            </button>

        </form>

        <p
            id="userSearchMessage"
            class="form-message"
        ></p>

        <div id="userSearchResult"></div>


        <!-- =========================
             CURRENT CHAT HEADER
        ========================== -->

        <div
            id="currentChatHeader"
            class="current-chat-header"
        >

            <div class="current-chat-top">

                <div>

                    <div
                        id="currentChatTitle"
                        class="current-chat-title"
                    >
                        Select a conversation
                    </div>

                    <div
                        id="chatPresence"
                        class="chat-presence"
                    ></div>

                </div>

                <button
                    id="chatSettingsButton"
                    class="chat-settings-button"
                    type="button"
                    disabled
                    title="Chat settings"
                    aria-label="Chat settings"
                >
                    ⚙️
                </button>

            </div>

            <div
                id="typingIndicator"
                class="typing-indicator"
            ></div>

            <!-- =========================
                 DISAPPEARING MESSAGE PANEL
            ========================== -->

            <div
                id="disappearingPanel"
                class="disappearing-panel hidden"
            >

                <div class="disappearing-panel-header">

                    <div>
                        <strong>
                            Disappearing Messages
                        </strong>

                        <span
                            id="disappearingCurrentTimer"
                            class="disappearing-current-timer"
                        >
                            Off
                        </span>
                    </div>

                    <button
                        id="closeDisappearingButton"
                        type="button"
                        class="disappearing-close-button"
                        aria-label="Close"
                    >
                        ×
                    </button>

                </div>

                <p class="disappearing-description">
                    New messages in this conversation will
                    disappear after the selected time.
                </p>

                <div
                    id="disappearingOptions"
                    class="disappearing-options"
                >

                    <button
                        type="button"
                        class="disappearing-option"
                        data-seconds="0"
                    >
                        <span>Off</span>
                        <span class="disappearing-check">✓</span>
                    </button>

                    <button
                        type="button"
                        class="disappearing-option"
                        data-seconds="30"
                    >
                        <span>30 seconds</span>
                        <span class="disappearing-check">✓</span>
                    </button>

                    <button
                        type="button"
                        class="disappearing-option"
                        data-seconds="60"
                    >
                        <span>1 minute</span>
                        <span class="disappearing-check">✓</span>
                    </button>

                    <button
                        type="button"
                        class="disappearing-option"
                        data-seconds="300"
                    >
                        <span>5 minutes</span>
                        <span class="disappearing-check">✓</span>
                    </button>

                    <button
                        type="button"
                        class="disappearing-option"
                        data-seconds="3600"
                    >
                        <span>1 hour</span>
                        <span class="disappearing-check">✓</span>
                    </button>

                    <button
                        type="button"
                        class="disappearing-option"
                        data-seconds="86400"
                    >
                        <span>1 day</span>
                        <span class="disappearing-check">✓</span>
                    </button>

                    <button
                        type="button"
                        class="disappearing-option"
                        data-seconds="604800"
                    >
                        <span>7 days</span>
                        <span class="disappearing-check">✓</span>
                    </button>

                </div>

                <p
                    id="disappearingStatus"
                    class="disappearing-status"
                ></p>

            </div>

        </div>


        <!-- =========================
             MESSAGES
        ========================== -->

        <div
            id="messages"
            class="messages"
        >

            <div class="empty-chat">

                <h2>
                    Welcome to TAARA*
                </h2>

                <p>
                    Select a conversation to start chatting.
                </p>

            </div>

        </div>


        <!-- =========================
             SEND MESSAGE
        ========================== -->

        <form
            id="messageForm"
            class="message-form"
        >

            <button
                id="attachButton"
                class="attach-button"
                type="button"
                disabled
                title="Attach file"
            >
                📎
            </button>

            <button
                id="voiceButton"
                class="voice-button"
                type="button"
                disabled
                title="Voice message"
            >
                🎤
            </button>

            <input
                id="fileInput"
                type="file"
                hidden
            >

            <input
                id="messageInput"
                type="text"
                placeholder="Type a message..."
                autocomplete="off"
                disabled
            >

            <button
                id="sendButton"
                type="submit"
                disabled
            >
                Send
            </button>

        </form>

        <div
            id="uploadStatus"
            class="upload-status"
        ></div>

    </div>

</section>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>
```

</body>
</html>
